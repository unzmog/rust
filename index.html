<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Team Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f7f7f7;
        }
        table {
            border-collapse: collapse;
            width: 60%;
            margin: 0 auto;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px 18px;
            text-align: left;
        }
        th {
            background: #4CAF50;
            color: white;
        }
        tr:nth-child(even){
            background: #f2f2f2;
        }
        caption {
            caption-side: top;
            font-size: 1.3em;
            margin-bottom: 10px;
        }
        .note {
            text-align: center;
            margin-top: 30px;
            font-size: 1.1em;
            color: #333;
        }
    </style>
</head>
<body>
    <table>
        <caption>Team Table</caption>
        <thead>
            <tr>
                <th>name</th>
                <th>group</th>
                <th>role</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice</td>
                <td>Admin</td>
                <td>Manager</td>
            </tr>
            <tr>
                <td>Bob</td>
                <td>Users</td>
                <td>Developer</td>
            </tr>
            <tr>
                <td>Carol</td>
                <td>Guests</td>
                <td>Viewer</td>
            </tr>
        </tbody>
    </table>
    <div class="note">This website was created by Rust with Leptos and Axum frameworks.</div>
</body>
</html>
